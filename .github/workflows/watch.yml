name: watch

on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub may delay scheduled runs by a few minutes
  workflow_dispatch:          # "Run workflow" button for manual checks

permissions:
  contents: write             # to commit state/seen.json

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check listings
        run: python -m watcher.main
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # Commit what was already sent, so the next run doesn't repeat it.
      # (The commits also keep the schedule alive: GitHub pauses cron
      # workflows in public repos after 60 days without activity.)
      - name: Save state
        run: |
          git config user.name "rent-watcher"
          git config user.email "rent-watcher@users.noreply.github.com"
          git add -f state/seen.json
          git diff --cached --quiet && exit 0
          git commit -q -m "state: update seen listings [skip ci]"
          for i in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep 5
          done
          exit 1
